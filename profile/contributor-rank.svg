<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="620" height="192" viewBox="0 0 620 192">
  <style>
    .title { font: 700 18px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .subtitle { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .name { font: 600 15px 'Segoe UI', Ubuntu, sans-serif; fill: #58a6ff; }
    .muted { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .stat { font: 500 13px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .num { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #3fb950; }
    .rank { font: 700 12px 'Segoe UI', Ubuntu, sans-serif; fill: #0d1117; }
    .medal { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
  </style>
  <rect width="620" height="192" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" class="title">Ranking de contribuidores — controle_contas</text>
  <text x="24" y="58" class="subtitle">Ordenado por score (commit ×1 + PR ×3 + issue ×2) · só deste repositório</text>
  <text x="300" y="82" class="subtitle">Commits</text>
  <text x="420" y="82" class="subtitle">PRs</text>
  <text x="510" y="82" class="subtitle">Issues</text>
  
  <clipPath id="avatarClip1"><circle cx="74" cy="128" r="18"/></clipPath>
  <rect x="16" y="100" width="588" height="48" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="36" cy="128" r="12" fill="#f1e05a"/>
  <text x="36" y="133" text-anchor="middle" class="rank">1</text>
  <image href="data:image/jpeg;base64," x="56" y="110" width="36" height="36" clip-path="url(#avatarClip1)"/>
  <a href="https://github.com/dudullsc">
    <text x="106" y="124" class="name">dudullsc</text>
  </a>
  <text x="106" y="142" class="muted">score 308</text>
  <text x="300" y="133" class="stat"><tspan class="num">308</tspan> commits</text>
  <text x="420" y="133" class="stat"><tspan class="num">0</tspan> PRs</text>
  <text x="510" y="133" class="stat"><tspan class="num">0</tspan> issues</text>

</svg>
