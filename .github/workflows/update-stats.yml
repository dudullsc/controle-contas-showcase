name: Update Repo Stats Cards

on:
  schedule:
    # 1º e 15º de cada mês às 12:00 UTC (~a cada 15 dias)
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate local repo stats & ranking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: dudullsc
          REPO: controle_contas
        run: python3 scripts/generate_repo_stats.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update controle_contas repo stats and ranking"
          git push
