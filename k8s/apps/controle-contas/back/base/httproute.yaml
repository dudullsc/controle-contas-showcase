apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: controle-contas-back
  namespace: controle-contas
spec:
  hostnames:
    - placeholder
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: cilium
      sectionName: https
  rules:
    # OpenResty na borda devolve 502 em /api*; usa /cc-api e reescreve para o backend.
    - matches:
        - path:
            type: PathPrefix
            value: /cc-api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: controle-contas-back
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: controle-contas-back
          port: 8000
