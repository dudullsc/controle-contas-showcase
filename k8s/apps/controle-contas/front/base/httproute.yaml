apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: controle-contas-front
  namespace: controle-contas
spec:
  hostnames:
    - placeholder
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: cilium
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: controle-contas-front
          port: 3000
