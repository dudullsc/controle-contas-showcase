apiVersion: apps/v1
kind: Deployment
metadata:
  name: controle-contas-front
  namespace: controle-contas
  labels:
    app: controle-contas-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controle-contas-front
  template:
    metadata:
      labels:
        app: controle-contas-front
    spec:
      priorityClassName: pc-6-apps-priority
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: controle-contas-front
          image: placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
